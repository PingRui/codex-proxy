# Retain the legacy app id so NSIS recognizes existing Codex Proxy installs as
# the same upgrade family. Product, executable, shortcut, and artifact names
# remain NEXORA; changing appId would strand the old installation side-by-side.
appId: com.codex-proxy.app
productName: NEXORA
electronVersion: "35.7.5"

publish:
  provider: github
  owner: PingRui
  repo: codex-proxy

artifactName: "NEXORA-${version}-${os}-${arch}.${ext}"

directories:
  output: release

# Pre-pack script copies config/, public/, bin/ from monorepo root into
# this directory. Paths here are relative to projectDir.
files:
  - dist-electron/**/*
  - config/**/*
  - public/**/*
  - electron/assets/**/*
  - LICENCE
  - NOTICE.md
  - THIRD_PARTY_NOTICES.md
  - package.json
  - "!node_modules"
  - "!dist"

# Static assets unpacked from asar (filesystem access at runtime)
asarUnpack:
  - "config/**/*"
  - "public/**/*"
  - "**/*.node"

# Extra resources (outside asar): cacert.pem, native addon
extraResources:
  - from: bin/
    to: bin/
    filter:
      - "**/*"
  - from: native/
    to: native/
    filter:
      - "**/*"
  - from: LICENCE
    to: LICENCE
  - from: NOTICE.md
    to: NOTICE.md
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md

win:
  # Keep unsigned local builds reproducible on Windows machines where creating
  # the winCodeSign cache symlinks requires Developer Mode or elevation.
  # This also means electron-builder cannot stamp the EXE resource icon. The
  # NEXORA icon is still applied explicitly to BrowserWindow and Tray at runtime.
  # Re-enable resource editing only together with a tested signing environment.
  signAndEditExecutable: false
  target:
    - target: nsis
      arch: [x64]
  icon: electron/assets/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: electron/assets/icon.png
  category: public.app-category.developer-tools
  # No Apple Developer certificate — electron-builder auto-falls back to
  # ad-hoc signing (codesign -s -). Users see "unidentified developer"
  # warning and can right-click → Open to bypass.

linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: electron/assets/icon.png
  category: Development
